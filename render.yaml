# Render Blueprint — backend NutriVillage AI (FastAPI + TiDB/MySQL).
#
# Cara pakai: di Render, New > Blueprint, pilih repo ini.
# Variabel bertanda `sync: false` WAJIB diisi manual di dashboard Render.
services:
  - type: web
    name: nutrivillage-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: ./scripts/start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: SKIP_CREATE_DATABASE
        value: "1"
      - key: SEED_DEMO_ACCOUNTS
        value: "0"
      # Data katalog/konten contoh: OFF di produksi (diisi manual lewat admin).
      - key: SEED_CONTENT
        value: "0"
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      # Wajib diisi manual:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_CA
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
